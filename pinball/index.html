<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinball | Dig Deeper Labs</title>
  <style>
    * { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05000a;
      overflow: hidden;
    }
    /* Shrink or grow the game to fit any screen, keeping its shape.
       This only changes how big it LOOKS. The game inside is the same size. */
    canvas {
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <!-- The library, loaded from our own folder so school laptops can't block it -->
  <script src="lib/p5.min.js"></script>
  <script src="lib/three.min.js"></script>

  <!-- Our game, in this order: numbers and layout, brain, camera, game loop -->
  <script src="table.js"></script>
  <script src="clue.js"></script>
  <script src="physics.js"></script>
  <script src="leaderboard.js"></script>
  <script src="draw.js"></script>
  <script src="draw3d.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
